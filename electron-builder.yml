appId: com.skyexpress.va
productName: Sky Express VA
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js,tsconfig.web.tsbuildinfo}'
  - '!**/*.sql'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/*.map'
  - '!dist/*'
  - '!build/*'
  - '!.git/*'
  - '!.agents/*'
  # Exclude dev dependencies that should never be in the bundle
  - '!node_modules/electron'
  - '!node_modules/electron-builder'
  - '!node_modules/electron-vite'
  - '!node_modules/electron-winstaller'
  - '!node_modules/app-builder-bin'
  - '!node_modules/app-builder-lib'
  - '!node_modules/7zip-bin'
  - '!node_modules/typescript'
  - '!node_modules/vite'
  - '!node_modules/.vite'
  - '!node_modules/prettier'
  - '!node_modules/eslint'
  - '!node_modules/eslint-*'
  - '!node_modules/@eslint'
  - '!node_modules/@vitejs'
  - '!node_modules/@esbuild'
  - '!node_modules/@types'
  - '!node_modules/@electron-toolkit/tsconfig'
  - '!node_modules/@electron-toolkit/eslint-*'
  - '!node_modules/tailwindcss'
  - '!node_modules/autoprefixer'
  - '!node_modules/postcss'
  - '!node_modules/postcss-*'
  - '!node_modules/png2icons'
  - '!node_modules/rcedit'
  - '!node_modules/react'
  - '!node_modules/react-dom'
  # Exclude large sub-dependencies only used at build time
  - '!node_modules/@babel'
  - '!node_modules/@reduxjs'
  - '!node_modules/dmg-builder'
  - '!node_modules/builder-util*'
  # Exclude test files and docs in remaining node_modules
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}/**'
  - '!**/node_modules/.cache/**'
  - '!**/*.md'
  - '!**/*.d.ts'
asarUnpack:
  - resources/**
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  license: EULA.txt
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sky Express VA

publish:
  provider: github
  owner: panagiotisspak20-ship-it
  repo: sky-express-va
